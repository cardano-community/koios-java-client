name: Release

# Publishes to Maven Central when a GitHub release is published.
# Can also be run manually, which is useful for retrying a failed publish
# without cutting a new release.
#
# Required repository secrets:
#   CENTRAL_TOKEN_USERNAME  - Central Portal user token username
#   CENTRAL_TOKEN_PASSWORD  - Central Portal user token password
#                             (central.sonatype.com -> profile -> Generate User Token;
#                              the old OSSRH credentials do not work)
#   GPG_PRIVATE_KEY         - ASCII-armored private key: gpg --armor --export-secret-keys KEY_ID
#   GPG_PASSPHRASE          - passphrase for that key

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
          # Writes a settings.xml with a <server> matching the pom's
          # publishingServerId, and imports the signing key.
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Tests are skipped deliberately: they run against live Koios instances and
      # are already covered by the Codecov, Preview, Preprod and Mainnet workflows.
      # A transient 429 from the public API should not be able to block a release.
      - name: Publish to Maven Central
        run: mvn --batch-mode clean deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
